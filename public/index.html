<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SLAY - 1st Anniversary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand-title">SLAY PHOTO WALL</div>
    <nav class="nav-links">
      <a href="/gallery.html">查看照片墙</a>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h1 class="welcome-title">SLAY 1 周年现场</h1>
      <p class="subtitle">上传你的瞬间，实时登上现场大屏！</p>

      <form id="uploadForm">
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
          <input type="file" id="fileInput" accept="image/*" style="display: none;">
          <div class="upload-icon">📸</div>
          <p id="uploadText">点击选择或拍摄照片</p>
        </div>

        <div style="margin-top: 15px;">
          <input type="text" id="commentInput" placeholder="写一句想说的话/祝福（选填弹幕）..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box;">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">发布到大屏</button>
      </form>
      <div id="statusMessage" class="status-msg"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const commentInput = document.getElementById('commentInput');
    const uploadText = document.getElementById('uploadText');
    const statusMessage = document.getElementById('statusMessage');

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        uploadText.innerText = `已选择: ${fileInput.files[0].name}`;
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!fileInput.files.length) {
        statusMessage.innerText = '请先选择一张照片！';
        return;
      }

      const formData = new FormData();
      formData.append('photo', fileInput.files[0]);
      formData.append('comment', commentInput.value.trim());

      statusMessage.innerText = '上传中...';

      try {
        const response = await fetch('/upload', { method: 'POST', body: formData });
        const result = await response.json();
        if (result.success) {
          statusMessage.innerText = '🎉 上传成功！即刻登上大屏！';
          form.reset();
          uploadText.innerText = '点击选择或拍摄照片';
        } else {
          statusMessage.innerText = '上传失败，请重试';
        }
      } catch (err) {
        statusMessage.innerText = '网络连接错误';
      }
    });
  </script>
</body>
</html>
