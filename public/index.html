<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SLAY DANCE STUDIO - 1st Anniversary</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 留言输入框专属美化样式 */
    .comment-input-container {
      margin: 15px 0;
      width: 100%;
    }
    .comment-input-container input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
      font-size: 14px;
      color: #334155;
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s ease;
      text-align: center;
    }
    .comment-input-container input:focus {
      border-color: #800020;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(128, 0, 32, 0.1);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">SLAY DANCE</div>
    <nav class="nav-links">
      <a href="/gallery.html">进入照片墙 &rarr;</a>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <div class="badge">1ST ANNIVERSARY PARTY</div>
      <h1 class="welcome-title">SLAY DANCE STUDIO</h1>
      <p class="subtitle">1 周年现场限定互动</p>
      
      <p class="desc">
        把你的炸场瞬间、表情包、合照上传大屏<br>
        一起 SLAY THE STAGE 🔥
      </p>

      <form id="uploadForm">
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
          <input type="file" id="fileInput" accept="image/*" style="display: none;">
          <div class="upload-icon">📸</div>
          <p id="uploadText" style="margin-top: 5px; font-size: 13px; color: #64748b;">点击选择或拍摄照片</p>
        </div>

        <!-- 仅新增留言框 -->
        <div class="comment-input-container">
          <input type="text" id="commentInput" placeholder="写一句弹幕留言/祝福（选填）...">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">发布到大屏</button>
      </form>
      <div id="statusMessage" class="status-msg"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const commentInput = document.getElementById('commentInput');
    const uploadText = document.getElementById('uploadText');
    const statusMessage = document.getElementById('statusMessage');

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        uploadText.innerText = `已选择: ${fileInput.files[0].name}`;
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!fileInput.files.length) {
        statusMessage.innerText = '请先选择一张照片！';
        return;
      }

      const formData = new FormData();
      formData.append('photo', fileInput.files[0]);
      formData.append('comment', commentInput.value.trim());

      statusMessage.innerText = '上传中...';

      try {
        const response = await fetch('/upload', { method: 'POST', body: formData });
        const result = await response.json();
        if (result.success) {
          statusMessage.innerText = '🎉 上传成功！即刻登上大屏！';
          form.reset();
          uploadText.innerText = '点击选择或拍摄照片';
        } else {
          statusMessage.innerText = '上传失败，请重试';
        }
      } catch (err) {
        statusMessage.innerText = '网络连接错误';
      }
    });
  </script>
</body>
</html>
