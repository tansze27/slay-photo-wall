<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLAY DANCE STUDIO - 1st Anniversary</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 原设计 Header：仅微调间距 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: #ffffff;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: #800020;
      letter-spacing: 0.5px;
    }

    .nav-links a {
      color: #1d1d1f;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* 原设计 Card：完全保持原貌 */
    .card {
      background: #ffffff;
      border-radius: 32px;
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
    }

    .badge {
      display: inline-block;
      background: #d8a7b1;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 20px;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .welcome-title {
      font-size: 24px;
      font-weight: 800;
      color: #1d1d1f;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: #8e8e93;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .desc {
      font-size: 14px;
      color: #6e6e73;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .upload-zone {
      cursor: pointer;
      margin-bottom: 20px;
    }

    .upload-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .upload-hint {
      font-size: 13px;
      color: #8e8e93;
    }

    .comment-container {
      margin-bottom: 24px;
    }

    .comment-input {
      width: 100%;
      padding: 16px 20px;
      border: 1px solid #e5e5ea;
      border-radius: 20px;
      background: #f9f9fb;
      font-size: 14px;
      color: #1d1d1f;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
    }

    .comment-input:focus {
      border-color: #800020;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(128, 0, 32, 0.08);
    }

    .btn-submit {
      width: 100%;
      background: #800020;
      color: #ffffff;
      border: none;
      padding: 18px;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      background: #600018;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .status-msg {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 600;
      color: #800020;
    }

    /* 移动端专属距离微调（绝不改变任何视觉与外观设计） */
    @media (max-width: 480px) {
      header {
        padding: 12px 16px;
      }
      .brand-title {
        font-size: 15px;
      }
      .nav-links a {
        font-size: 12px;
      }
      .container {
        padding: 10px 16px;
      }
      .card {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">SLAY DANCE STUDIO</div>
    <nav class="nav-links">
      <a href="/gallery.html">进入照片墙 &rarr;</a>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <div class="badge">1ST ANNIVERSARY PARTY</div>
      <h1 class="welcome-title">SLAY DANCE STUDIO</h1>
      <p class="subtitle">1 周年现场限定互动</p>
      
      <p class="desc">
        把你的炸场瞬间、表情包、合照上传大屏<br>
        一起 SLAY THE STAGE 🔥
      </p>

      <form id="uploadForm">
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
          <input type="file" id="fileInput" accept="image/*" style="display: none;">
          <div class="upload-icon">📸</div>
          <p id="uploadText" class="upload-hint">点击选择或拍摄照片</p>
        </div>

        <div class="comment-container">
          <input type="text" id="commentInput" class="comment-input" placeholder="写一句弹幕留言/祝福（选填）...">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">发布到大屏</button>
      </form>
      <div id="statusMessage" class="status-msg"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const commentInput = document.getElementById('commentInput');
    const uploadText = document.getElementById('uploadText');
    const statusMessage = document.getElementById('statusMessage');

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        uploadText.innerText = `已选择: ${fileInput.files[0].name}`;
        uploadText.style.color = '#1d1d1f';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!fileInput.files.length) {
        statusMessage.innerText = '请先选择一张照片！';
        return;
      }

      const formData = new FormData();
      formData.append('photo', fileInput.files[0]);
      formData.append('comment', commentInput.value.trim());

      statusMessage.innerText = '上传中...';

      try {
        const response = await fetch('/upload', { method: 'POST', body: formData });
        const result = await response.json();
        if (result.success) {
          statusMessage.innerText = '🎉 上传成功！即刻登上大屏！';
          form.reset();
          uploadText.innerText = '点击选择或拍摄照片';
          uploadText.style.color = '#8e8e93';
        } else {
          statusMessage.innerText = '上传失败，请重试';
        }
      } catch (err) {
        statusMessage.innerText = '网络连接错误';
      }
    });
  </script>
</body>
</html>
