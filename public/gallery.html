<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLAY - 照片墙</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; min-height: 100vh; }
    
    header { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 30px; padding-bottom: 15px; border-bottom: 1px solid #222; }
    .brand { font-size: 20px; font-weight: 800; color: #800020; text-decoration: none; }
    .back-btn { color: #aaa; text-decoration: none; font-size: 14px; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; }

    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
    
    .card-item { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #1a1a1a; cursor: pointer; border: 1px solid #222; }
    .card-item img { width: 100%; height: 100%; object-fit: cover; }
    
    /* 爱心点赞按钮 */
    .like-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      color: #ff4757;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 2;
    }

    /* 弹窗部分 */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; flex-direction: column; }
    .modal.active { display: flex; }
    .modal-img { max-width: 90vw; max-height: 70vh; object-fit: contain; border-radius: 12px; }
    .modal-actions { margin-top: 20px; display: flex; gap: 15px; align-items: center; }
    .btn-action { padding: 10px 20px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-like { background: #ff4757; color: #fff; }
    .btn-delete { background: #333; color: #ff4d4d; }
    .btn-close { background: #222; color: #fff; }
  </style>
</head>
<body>

  <header>
    <a href="/" class="brand">SLAY PHOTO WALL</a>
    <a href="/" class="back-btn">&larr; 返回上传</a>
  </header>

  <div class="gallery-grid" id="grid"></div>

  <!-- 大图预览Modal -->
  <div class="modal" id="modal">
    <img id="modalImg" class="modal-img" src="">
    <div class="modal-actions">
      <button class="btn-action btn-like" id="likeBtn">❤️ 点赞 (<span id="modalLikes">0</span>)</button>
      <button class="btn-action btn-delete" id="deleteBtn">🗑️ 删除</button>
      <button class="btn-action btn-close" onclick="closeModal()">关闭</button>
    </div>
  </div>

  <script>
    const socket = io();
    const grid = document.getElementById('grid');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    const modalLikes = document.getElementById('modalLikes');
    const likeBtn = document.getElementById('likeBtn');
    const deleteBtn = document.getElementById('deleteBtn');

    let currentPhotoUrl = '';
    let photosData = [];

    function renderGrid(photos) {
      photosData = photos;
      grid.innerHTML = photos.map(p => `
        <div class="card-item" onclick="openModal('${p.url}')">
          <img src="${p.url}" loading="lazy">
          <div class="like-badge" onclick="event.stopPropagation(); doLike('${p.url}')">
            ❤️ ${p.likes || 0}
          </div>
        </div>
      `).join('');
    }

    function loadPhotos() {
      fetch('/api/photos').then(r => r.json()).then(renderGrid);
    }

    function openModal(url) {
      currentPhotoUrl = url;
      modalImg.src = url;
      const item = photosData.find(p => p.url === url);
      modalLikes.innerText = item ? (item.likes || 0) : 0;
      modal.classList.add('active');
    }

    function closeModal() { modal.classList.remove('active'); }

    async function doLike(url) {
      const res = await fetch('/api/photos/like', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      if(data.success && currentPhotoUrl === url) {
        modalLikes.innerText = data.likes;
      }
    }

    likeBtn.addEventListener('click', () => { if(currentPhotoUrl) doLike(currentPhotoUrl); });

    deleteBtn.addEventListener('click', async () => {
      if (!currentPhotoUrl) return;
      const password = prompt('请输入管理员密码以删除照片：');
      if (!password) return;

      const res = await fetch('/api/photos/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: currentPhotoUrl, password })
      });

      const data = await res.json();
      if (data.success) { closeModal(); } 
      else { alert(data.message || '密码错误！'); }
    });

    socket.on('new-photo', loadPhotos);
    socket.on('photo-deleted', loadPhotos);
    socket.on('like-updated', ({ url, likes }) => {
      const item = photosData.find(p => p.url === url);
      if(item) item.likes = likes;
      renderGrid(photosData);
      if(currentPhotoUrl === url) modalLikes.innerText = likes;
    });

    loadPhotos();
  </script>
</body>
</html>
