<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" sizes="55x55" href="/SLAY LOGO.png">
<link rel="apple-touch-icon" href="/SLAY LOGO.png">  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLAY - Live Slideshow</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background: #080205; 
      color: #fff; 
      overflow: hidden; 
      font-family: system-ui, -apple-system, sans-serif; 
      height: 100vh; 
      width: 100vw;
      position: relative;
    }

    #bgCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .slide-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      perspective: 1000px;
    }

    /* 拍立得复古相框通用基类 */
    .polaroid-frame {
      position: absolute;
      background: #ffffff;
      padding: 14px 14px 68px 14px;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform, opacity;
      max-width: 85vw;
      max-height: 85vh;
    }

    .polaroid-img {
      max-width: 80vw;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 4px;
      display: block;
    }

    /* 三个位置的布局：主屏（Center）、左侧（Prev）、右侧（Next） */
    .polaroid-frame.pos-center {
      transform: translateX(0) scale(1);
      opacity: 1;
      z-index: 10;
      filter: brightness(1);
    }

    .polaroid-frame.pos-prev {
      transform: translateX(-38vw) scale(0.68) rotateY(8deg);
      opacity: 0.55;
      z-index: 5;
      filter: brightness(0.7);
    }

    .polaroid-frame.pos-next {
      transform: translateX(38vw) scale(0.68) rotateY(-8deg);
      opacity: 0.55;
      z-index: 5;
      filter: brightness(0.7);
    }

    .polaroid-frame.pos-hidden {
      transform: translateX(0) scale(0.4);
      opacity: 0;
      z-index: 1;
    }

    /* 拍立得底栏区域 */
    .polaroid-footer {
      position: absolute;
      bottom: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: #1d1d1f;
    }

    .polaroid-logo { 
      font-size: 12px; 
      letter-spacing: 1.5px; 
      color: #800020; 
      font-weight: 800;
      white-space: nowrap; 
      flex-shrink: 0;
    }
    
    .polaroid-comment {
      font-size: 15px;
      color: #111111;
      text-align: center;
      font-weight: 700;
      flex: 1;
      word-break: break-word;
      line-height: 1.2;
      padding: 0 4px;
    }

    .polaroid-time { 
      font-size: 11px; 
      color: #888; 
      font-weight: 600;
      white-space: nowrap; 
      flex-shrink: 0;
    }

    /* 实时全屏飘屏弹幕 */
    .danmaku-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }

    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(128, 0, 32, 0.9), 0 0 20px rgba(255, 71, 87, 0.6);
      background: rgba(128, 0, 32, 0.88);
      backdrop-filter: blur(8px);
      padding: 8px 22px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      animation: flyLeft 8s linear forwards;
    }

    @keyframes flyLeft {
      from { transform: translateX(100vw); }
      to { transform: translateX(-100%); }
    }

    /* 右下角常驻 QR Code */
    .qr-corner-card {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .qr-corner-card img {
      width: 100px;
      height: 100px;
      border-radius: 8px;
      display: block;
    }

    .qr-corner-card span {
      font-size: 11px;
      color: #800020;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.6);
      padding: 8px 16px;
      border-radius: 20px;
      z-index: 100;
      font-size: 13px;
      opacity: 0.2;
      transition: opacity 0.3s;
    }
    .controls:hover { opacity: 1; }
    .controls select { background: #222; color: #fff; border: 1px solid #555; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div class="controls">
    ⏱️ 切换间隔:
    <select id="speedSelect" onchange="updateSpeed(this.value)">
      <option value="3000">3 秒</option>
      <option value="5000" selected>5 秒</option>
      <option value="8000">8 秒</option>
    </select>
  </div>

  <div class="qr-corner-card">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://slay-photo-wall.onrender.com" alt="Scan to Upload">
    <span>扫码上传登屏 🔥</span>
  </div>

  <div class="danmaku-container" id="danmakuContainer"></div>

  <!-- 3D 轮播舞台：左（Prev）、中（Center）、右（Next） -->
  <div class="slide-stage">
    <div id="frameLeft" class="polaroid-frame pos-prev">
      <img id="imgLeft" class="polaroid-img" src="">
      <div class="polaroid-footer">
        <span class="polaroid-logo">SLAY</span>
        <span id="commentLeft" class="polaroid-comment"></span>
        <span id="timeLeft" class="polaroid-time">--:--</span>
      </div>
    </div>

    <div id="frameCenter" class="polaroid-frame pos-center">
      <img id="imgCenter" class="polaroid-img" src="">
      <div class="polaroid-footer">
        <span class="polaroid-logo">SLAY</span>
        <span id="commentCenter" class="polaroid-comment"></span>
        <span id="timeCenter" class="polaroid-time">--:--</span>
      </div>
    </div>

    <div id="frameRight" class="polaroid-frame pos-next">
      <img id="imgRight" class="polaroid-img" src="">
      <div class="polaroid-footer">
        <span class="polaroid-logo">SLAY</span>
        <span id="commentRight" class="polaroid-comment"></span>
        <span id="timeRight" class="polaroid-time">--:--</span>
      </div>
    </div>
  </div>

  <script>
    // --- Canvas 背景粒子 ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedY = Math.random() * 0.8 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.opacity = Math.random() * 0.5 + 0.2;
        this.color = Math.random() > 0.5 ? 'rgba(128, 0, 32, ' : 'rgba(212, 175, 55, ';
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < 0) this.reset();
      }
      draw() {
        ctx.fillStyle = this.color + this.opacity + ')';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 70; i++) particles.push(new Particle());

    function animateBG() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateBG);
    }
    animateBG();

    // --- 3D 左右排布逻辑 ---
    const socket = io();
    const danmakuContainer = document.getElementById('danmakuContainer');

    const elements = {
      left: { img: document.getElementById('imgLeft'), comment: document.getElementById('commentLeft'), time: document.getElementById('timeLeft'), frame: document.getElementById('frameLeft') },
      center: { img: document.getElementById('imgCenter'), comment: document.getElementById('commentCenter'), time: document.getElementById('timeCenter'), frame: document.getElementById('frameCenter') },
      right: { img: document.getElementById('imgRight'), comment: document.getElementById('commentRight'), time: document.getElementById('timeRight'), frame: document.getElementById('frameRight') }
    };

    let photos = [];
    let currentIndex = 0;
    let timer = null;
    let currentInterval = 5000;

    function sendDanmaku(text) {
      if (!text) return;
      const el = document.createElement('div');
      el.className = 'danmaku-item';
      el.innerText = `💬 ${text}`;
      const topPos = Math.floor(Math.random() * 55) + 12; 
      el.style.top = topPos + 'vh';
      danmakuContainer.appendChild(el);
      setTimeout(() => { el.remove(); }, 8000);
    }

    function checkFireworks(comment) {
      if (!comment) return;
      const keywords = ['生日快乐', 'slay', '周年', '快乐', '1st', '炸场'];
      if (keywords.some(kw => comment.toLowerCase().includes(kw))) {
        confetti({ particleCount: 110, spread: 75, origin: { y: 0.6 } });
      }
    }

    function fillFrameData(target, photoItem) {
      if (!photoItem) {
        target.frame.style.visibility = 'hidden';
        return;
      }
      target.frame.style.visibility = 'visible';
      target.img.src = photoItem.url;
      target.time.innerText = photoItem.formattedTime || '';
      
      if (photoItem.comment) {
        target.comment.innerText = `💬 "${photoItem.comment}" ${photoItem.likes ? '❤️' + photoItem.likes : ''}`;
      } else {
        target.comment.innerText = photoItem.likes ? `❤️ ${photoItem.likes}` : '';
      }
    }

    function updateCarousel() {
      if (photos.length === 0) return;

      const total = photos.length;
      
      // 计算前一张 (Prev) 和 后一张 (Next) 的索引
      const prevIndex = (currentIndex - 1 + total) % total;
      const nextIndex = (currentIndex + 1) % total;

      const centerPhoto = photos[currentIndex];

      // 给三个框装载数据（多于1张时才显示两侧卡片）
      fillFrameData(elements.center, centerPhoto);
      fillFrameData(elements.left, total > 1 ? photos[prevIndex] : null);
      fillFrameData(elements.right, total > 2 ? photos[nextIndex] : null);

      // 触发主屏弹幕与烟花
      if (centerPhoto && centerPhoto.comment) {
        sendDanmaku(centerPhoto.comment);
      }
    }

    function startSlideshow() {
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        if (photos.length > 0) {
          currentIndex = (currentIndex + 1) % photos.length;
          updateCarousel();
        }
      }, currentInterval);
    }

    function updateSpeed(v) { currentInterval = parseInt(v); startSlideshow(); }

    fetch('/api/photos').then(r => r.json()).then(data => {
      photos = data;
      if (photos.length > 0) {
        updateCarousel();
        startSlideshow();
      }
    });

    socket.on('new-photo', (photo) => {
      photos.unshift(photo);
      currentIndex = 0;
      updateCarousel();
      startSlideshow();

      if (photo.comment) {
        checkFireworks(photo.comment);
      }
    });

    socket.on('photo-deleted', (url) => {
      photos = photos.filter(p => p.url !== url);
      if (photos.length > 0) {
        currentIndex = currentIndex % photos.length;
        updateCarousel();
      }
    });

    socket.on('like-updated', ({ url, likes }) => {
      const p = photos.find(item => item.url === url);
      if(p) p.likes = likes;
    });
  </script>
</body>
</html>
