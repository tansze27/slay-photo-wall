<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLAY - 1st Anniversary Live Slideshow</title>
  <script src="/socket.io/socket.io.js"></script>
  <!-- 引入全屏烟花/彩带效果库 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Feature 3: 动态霓虹渐变背景 */
    body { 
      background: linear-gradient(-45deg, #050505, #1a0008, #050505, #0f0005);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff; 
      overflow: hidden; 
      font-family: system-ui, -apple-system, sans-serif; 
      height: 100vh; 
      width: 100vw;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .slide-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Feature 4: 拍立得复古相框包裹层 */
    .polaroid-frame {
      position: absolute;
      background: #ffffff;
      padding: 16px 16px 60px 16px;
      border-radius: 8px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 1.2s ease, transform 1.2s ease;
      will-change: opacity, transform;
      max-width: 85vw;
      max-height: 85vh;
    }

    .polaroid-frame.active {
      opacity: 1;
      z-index: 2;
    }

    .polaroid-img {
      max-width: 80vw;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 4px;
      display: block;
    }

    /* 拍立得底栏签名区 */
    .polaroid-footer {
      position: absolute;
      bottom: 12px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #1d1d1f;
      font-weight: 700;
    }

    .polaroid-logo { font-size: 14px; letter-spacing: 1px; color: #800020; }
    .polaroid-time { font-size: 12px; color: #888; }

    /* 弹幕卡片 */
    .comment-box {
      position: absolute;
      bottom: 80px;
      z-index: 10;
      background: rgba(128, 0, 32, 0.9);
      backdrop-filter: blur(10px);
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: none;
      max-width: 80vw;
      text-align: center;
    }

    /* Feature 1: 霸屏超级祝福 Overlay */
    .super-notice {
      position: fixed;
      inset: 0;
      background: rgba(128, 0, 32, 0.85);
      z-index: 999;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .super-notice h1 { font-size: 60px; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(255,215,0,0.8); margin-bottom: 20px; }
    .super-notice p { font-size: 32px; color: #ffeaa7; font-weight: 700; }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Feature 5: 右上角二维码与放大弹窗 */
    .qr-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.95);
      padding: 8px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }
    .qr-badge:hover { transform: scale(1.05); }
    .qr-badge img { width: 36px; height: 36px; border-radius: 4px; }
    .qr-badge span { font-size: 12px; color: #111; font-weight: bold; }

    .qr-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .qr-modal.active { display: flex; }
    .qr-modal img { width: 300px; height: 300px; border-radius: 16px; border: 4px solid #fff; }
    .qr-modal p { margin-top: 15px; font-size: 20px; font-weight: bold; color: #fff; }

    .controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.6);
      padding: 8px 16px;
      border-radius: 20px;
      z-index: 100;
      font-size: 13px;
      opacity: 0.2;
      transition: opacity 0.3s;
    }
    .controls:hover { opacity: 1; }
    .controls select { background: #222; color: #fff; border: 1px solid #555; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="controls">
    ⏱️ 切换间隔:
    <select id="speedSelect" onchange="updateSpeed(this.value)">
      <option value="3000">3 秒</option>
      <option value="5000" selected>5 秒</option>
      <option value="8000">8 秒</option>
    </select>
  </div>

  <!-- 右上角二维码按钮 -->
  <div class="qr-badge" onclick="toggleQR(true)">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://slay-photo-wall.onrender.com" alt="QR">
    <span>扫码上传 &rarr;</span>
  </div>

  <!-- 放大二维码 Modal -->
  <div class="qr-modal" id="qrModal" onclick="toggleQR(false)">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://slay-photo-wall.onrender.com" alt="QR Large">
    <p>扫码立即上传现场写真登屏 🔥</p>
  </div>

  <!-- 霸屏超级弹幕 overlay -->
  <div class="super-notice" id="superNotice">
    <h1>🎉 SLAY 霸屏祝福 🎉</h1>
    <p id="superNoticeText"></p>
  </div>

  <!-- 拍立得舞台 -->
  <div class="slide-stage">
    <div id="frameA" class="polaroid-frame">
      <img id="imgA" class="polaroid-img" src="">
      <div class="polaroid-footer">
        <span class="polaroid-logo">SLAY 1st Anniversary</span>
        <span id="timeA" class="polaroid-time">--:--</span>
      </div>
    </div>

    <div id="frameB" class="polaroid-frame">
      <img id="imgB" class="polaroid-img" src="">
      <div class="polaroid-footer">
        <span class="polaroid-logo">SLAY 1st Anniversary</span>
        <span id="timeB" class="polaroid-time">--:--</span>
      </div>
    </div>

    <div id="commentBox" class="comment-box"></div>
  </div>

  <script>
    const socket = io();
    const frameA = document.getElementById('frameA');
    const frameB = document.getElementById('frameB');
    const imgA = document.getElementById('imgA');
    const imgB = document.getElementById('imgB');
    const timeA = document.getElementById('timeA');
    const timeB = document.getElementById('timeB');
    const commentBox = document.getElementById('commentBox');
    const superNotice = document.getElementById('superNotice');
    const superNoticeText = document.getElementById('superNoticeText');
    const qrModal = document.getElementById('qrModal');

    let photos = [];
    let currentIndex = 0;
    let timer = null;
    let currentInterval = 5000;
    let activeSlot = 'A';

    function toggleQR(show) {
      if(show) qrModal.classList.add('active');
      else qrModal.classList.remove('active');
    }

    // 检查霸屏关键字触发烟花/拉花
    function checkSuperNotice(comment) {
      if (!comment) return;
      const keywords = ['生日快乐', 'slay', '周年', '快乐', '1st', '炸场'];
      const hasKeyword = keywords.some(kw => comment.toLowerCase().includes(kw));

      if (hasKeyword) {
        // 放全屏拉花烟花
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        
        // 居中放大霸屏闪烁 3 秒
        superNoticeText.innerText = `"${comment}"`;
        superNotice.style.display = 'flex';
        setTimeout(() => { superNotice.style.display = 'none'; }, 3200);
      }
    }

    function showPhoto(index) {
      if (photos.length === 0) return;
      const item = photos[index];
      
      const currentFrame = activeSlot === 'A' ? frameA : frameB;
      const nextFrame = activeSlot === 'A' ? frameB : frameA;
      const nextImg = activeSlot === 'A' ? imgB : imgA;
      const nextTime = activeSlot === 'A' ? timeB : timeA;

      nextImg.src = item.url;
      nextTime.innerText = item.formattedTime || '';

      nextFrame.classList.add('active');
      currentFrame.classList.remove('active');

      activeSlot = activeSlot === 'A' ? 'B' : 'A';

      if (item.comment) {
        commentBox.innerText = `💬 "${item.comment}" (❤️ ${item.likes || 0})`;
        commentBox.style.display = 'block';
        checkSuperNotice(item.comment);
      } else {
        commentBox.style.display = 'none';
      }
    }

    function startSlideshow() {
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        if (photos.length > 0) {
          currentIndex = (currentIndex + 1) % photos.length;
          showPhoto(currentIndex);
        }
      }, currentInterval);
    }

    function updateSpeed(v) { currentInterval = parseInt(v); startSlideshow(); }

    fetch('/api/photos').then(r => r.json()).then(data => {
      photos = data;
      if (photos.length > 0) {
        imgA.src = photos[0].url;
        timeA.innerText = photos[0].formattedTime || '';
        frameA.classList.add('active');
        showPhoto(0);
        startSlideshow();
      }
    });

    socket.on('new-photo', (photo) => {
      photos.unshift(photo);
      currentIndex = 0;
      showPhoto(0);
      startSlideshow();
    });

    socket.on('photo-deleted', (url) => {
      photos = photos.filter(p => p.url !== url);
      if(photos.length > 0) { showPhoto(0); }
    });

    socket.on('like-updated', ({ url, likes }) => {
      const p = photos.find(item => item.url === url);
      if(p) p.likes = likes;
    });
  </script>
</body>
</html>
