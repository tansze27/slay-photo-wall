<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLAY - Live Slideshow</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background: #080205; 
      color: #fff; 
      overflow: hidden; 
      font-family: system-ui, -apple-system, sans-serif; 
      height: 100vh; 
      width: 100vw;
      position: relative;
    }

    #bgCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .slide-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    /* 拍立得复古相框 */
    .polaroid-frame {
      position: absolute;
      background: #ffffff;
      padding: 16px 16px 70px 16px;
      border-radius: 8px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 1.2s ease, transform 1.2s ease;
      will-change: opacity, transform;
      max-width: 85vw;
      max-height: 85vh;
    }

    .polaroid-frame.active {
      opacity: 1;
      z-index: 2;
    }

    .polaroid-img {
      max-width: 80vw;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 4px;
      display: block;
    }

    /* 拍立得底栏区域 */
    .polaroid-footer {
      position: absolute;
      bottom: 12px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: #1d1d1f;
      font-weight: 700;
    }

    .polaroid-logo { 
      font-size: 13px; 
      letter-spacing: 1.5px; 
      color: #800020; 
      white-space: nowrap; 
      flex-shrink: 0;
    }
    
    .polaroid-comment {
      font-size: 13px;
      color: #222;
      text-align: center;
      font-weight: 600;
      flex: 1;
      word-break: break-word;
      line-height: 1.2;
      padding: 0 4px;
    }

    .polaroid-time { 
      font-size: 11px; 
      color: #888; 
      white-space: nowrap; 
      flex-shrink: 0;
    }

    /* 实时全屏飘屏弹幕（z-index 提升至 9999，确保在图片上方飘过） */
    .danmaku-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }

    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(128, 0, 32, 0.9), 0 0 20px rgba(255, 71, 87, 0.6);
      background: rgba(128, 0, 32, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 22px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      animation: flyLeft 8s linear forwards;
    }

    @keyframes flyLeft {
      from { transform: translateX(100vw); }
      to { transform: translateX(-100%); }
    }

    /* 右上角二维码 */
    .qr-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.95);
      padding: 8px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }
    .qr-badge:hover { transform: scale(1.05); }
    .qr-badge img { width: 36px; height: 36px; border-radius: 4px; }
    .qr-badge span { font-size: 12px; color: #111; font-weight: bold; }

    .qr-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .qr-modal.active { display: flex; }
    .qr-modal img { width: 300px; height: 300px; border-radius: 16px; border: 4px solid #fff; }
    .qr-modal p { margin-top: 15px; font-size: 20px; font-weight: bold; color: #fff; }

    .controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.6);
      padding: 8px 16px;
      border-radius: 20px;
      z-index: 100;
      font-size: 13px;
      opacity: 0.2;
      transition: opacity 0.3s;
    }
    .controls:hover { opacity: 1; }
    .controls select { background: #222; color: #fff; border: 1px solid #555; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Canvas 背景粒子 -->
  <canvas id="bgCanvas"></canvas>

  <div class="controls">
    ⏱️ 切换间隔:
    <select id="speedSelect" onchange="updateSpeed(this.value)">
      <option value="3000">3 秒</option>
      <option value="5000" selected>5 秒</option>
      <option value="8000">8 秒</option>
    </select>
  </div>

  <div class="qr-badge" onclick="toggleQR(true)">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://slay-photo-wall.onrender.com" alt="QR">
    <span>扫码上传 &rarr;</span>
  </div>

  <div class="qr-modal" id="qrModal" onclick="toggleQR(false)">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://slay-photo-wall.onrender.com" alt="QR Large">
    <p>扫码立即上传现场写真登屏 🔥</p>
  </div>

  <!-- 放置在图片上层的弹幕容器 -->
  <div class="danmaku-container" id="danmakuContainer"></div>

  <div class="slide-stage">
    <div id="frameA" class="polaroid-frame">
      <img id="imgA" class="polaroid-img" src="">
      <div class="polaroid-footer">
        <span class="polaroid-logo">SLAY</span>
        <span id="commentA" class="polaroid-comment"></span>
        <span id="timeA" class="polaroid-time">--:--</span>
      </div>
    </div>

    <div id="frameB" class="polaroid-frame">
      <img id="imgB" class="polaroid-img" src="">
      <div class="polaroid-footer">
        <span class="polaroid-logo">SLAY</span>
        <span id="commentB" class="polaroid-comment"></span>
        <span id="timeB" class="polaroid-time">--:--</span>
      </div>
    </div>
  </div>

  <script>
    // --- 动态粒子背景 ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedY = Math.random() * 0.8 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.opacity = Math.random() * 0.5 + 0.2;
        this.color = Math.random() > 0.5 ? 'rgba(128, 0, 32, ' : 'rgba(212, 175, 55, ';
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < 0) this.reset();
      }
      draw() {
        ctx.fillStyle = this.color + this.opacity + ')';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 70; i++) particles.push(new Particle());

    function animateBG() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateBG);
    }
    animateBG();

    // --- 逻辑处理 ---
    const socket = io();
    const frameA = document.getElementById('frameA');
    const frameB = document.getElementById('frameB');
    const imgA = document.getElementById('imgA');
    const imgB = document.getElementById('imgB');
    const commentA = document.getElementById('commentA');
    const commentB = document.getElementById('commentB');
    const timeA = document.getElementById('timeA');
    const timeB = document.getElementById('timeB');
    const danmakuContainer = document.getElementById('danmakuContainer');
    const qrModal = document.getElementById('qrModal');

    let photos = [];
    let currentIndex = 0;
    let timer = null;
    let currentInterval = 5000;
    let activeSlot = 'A';

    function toggleQR(show) {
      if(show) qrModal.classList.add('active');
      else qrModal.classList.remove('active');
    }

    function sendDanmaku(text) {
      if (!text) return;
      const el = document.createElement('div');
      el.className = 'danmaku-item';
      el.innerText = `💬 ${text}`;
      
      const topPos = Math.floor(Math.random() * 60) + 12; 
      el.style.top = topPos + 'vh';
      
      danmakuContainer.appendChild(el);
      setTimeout(() => { el.remove(); }, 8000);
    }

    function checkFireworks(comment) {
      if (!comment) return;
      const keywords = ['生日快乐', 'slay', '周年', '快乐', '1st', '炸场'];
      if (keywords.some(kw => comment.toLowerCase().includes(kw))) {
        confetti({ particleCount: 110, spread: 75, origin: { y: 0.6 } });
      }
    }

    function showPhoto(index) {
      if (photos.length === 0) return;
      const item = photos[index];
      
      const currentFrame = activeSlot === 'A' ? frameA : frameB;
      const nextFrame = activeSlot === 'A' ? frameB : frameA;
      const nextImg = activeSlot === 'A' ? imgB : imgA;
      const nextComment = activeSlot === 'A' ? commentB : commentA;
      const nextTime = activeSlot === 'A' ? timeB : timeA;

      nextImg.src = item.url;
      nextTime.innerText = item.formattedTime || '';
      
      if (item.comment) {
        nextComment.innerText = `💬 "${item.comment}" ${item.likes ? '❤️' + item.likes : ''}`;
      } else {
        nextComment.innerText = item.likes ? `❤️ ${item.likes}` : '';
      }

      nextFrame.classList.add('active');
      currentFrame.classList.remove('active');

      activeSlot = activeSlot === 'A' ? 'B' : 'A';
    }

    function startSlideshow() {
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        if (photos.length > 0) {
          currentIndex = (currentIndex + 1) % photos.length;
          showPhoto(currentIndex);
        }
      }, currentInterval);
    }

    function updateSpeed(v) { currentInterval = parseInt(v); startSlideshow(); }

    fetch('/api/photos').then(r => r.json()).then(data => {
      photos = data;
      if (photos.length > 0) {
        imgA.src = photos[0].url;
        timeA.innerText = photos[0].formattedTime || '';
        if (photos[0].comment) commentA.innerText = `💬 "${photos[0].comment}"`;
        frameA.classList.add('active');
        showPhoto(0);
        startSlideshow();
      }
    });

    socket.on('new-photo', (photo) => {
      photos.unshift(photo);
      currentIndex = 0;
      showPhoto(0);
      startSlideshow();

      if (photo.comment) {
        sendDanmaku(photo.comment);
        checkFireworks(photo.comment);
      }
    });

    socket.on('photo-deleted', (url) => {
      photos = photos.filter(p => p.url !== url);
      if(photos.length > 0) { showPhoto(0); }
    });

    socket.on('like-updated', ({ url, likes }) => {
      const p = photos.find(item => item.url === url);
      if(p) p.likes = likes;
    });
  </script>
</body>
</html>
